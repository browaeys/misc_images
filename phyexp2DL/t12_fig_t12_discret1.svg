<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Estimation médiane du temps de demi-montée</title>
  <desc id="desc">Deux mesures successives encadrent la température de demi-montée. Le temps estimé est choisi au milieu de l’intervalle temporel entre ces deux mesures.</desc>
  <rect width="1000" height="600" fill="#fff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#20242a"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#d97a18"/></marker>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity=".16"/></filter>
  </defs>
  <style>
    .ui{font-family:Inter,Avenir,"Helvetica Neue",Arial,sans-serif;fill:#20242a}.math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;fill:#20242a;font-style:italic}.math-label{font-size:21px}.note{font-size:17px;fill:#505861}.axis{stroke:#20242a;stroke-width:1.8;marker-end:url(#arrow)}.frame{fill:#fbfcfd;stroke:#d6dae0;stroke-width:1.2}.sample{fill:#3478c9;stroke:#fff;stroke-width:2.5}.bracket{fill:#fff;stroke:#d97a18;stroke-width:4;filter:url(#halo)}.half{stroke:#737b86;stroke-width:1.7;stroke-dasharray:7 7}.estimate-line{stroke:#b33a3a;stroke-width:2;stroke-dasharray:8 7}.estimate{fill:#b33a3a;stroke:#fff;stroke-width:3;filter:url(#halo)}.leader{fill:none;stroke:#737b86;stroke-width:1.3}.interval{fill:#d97a18;opacity:.07}.span{stroke:#d97a18;stroke-width:1.5;marker-start:url(#arrow2);marker-end:url(#arrow2)}
  </style>
  <rect x="118" y="58" width="800" height="430" rx="2" class="frame"/>
  <rect x="432" y="58" width="120" height="430" class="interval"/>
  <line x1="118" y1="488" x2="938" y2="488" class="axis"/><line x1="118" y1="488" x2="118" y2="38" class="axis"/>
  <g class="sample"><circle cx="155" cy="451" r="7"/><circle cx="247" cy="410" r="7"/><circle cx="339" cy="350" r="7"/><circle cx="668" cy="145" r="7"/><circle cx="784" cy="116" r="7"/><circle cx="882" cy="104" r="7"/></g>
  <circle cx="432" cy="300" r="10" class="bracket"/><circle cx="552" cy="200" r="10" class="bracket"/>
  <line x1="118" y1="275" x2="918" y2="275" class="half"/>
  <line x1="492" y1="275" x2="492" y2="488" class="estimate-line"/><circle cx="492" cy="275" r="8" class="estimate"/>
  <line x1="441" y1="461" x2="483" y2="461" class="span"/>
  <line x1="501" y1="461" x2="543" y2="461" class="span"/>
  <line x1="492" y1="451" x2="492" y2="471" stroke="#d97a18" stroke-width="2"/>
  <text x="96" y="282" text-anchor="end" class="math math-label">T<tspan baseline-shift="sub" font-size="70%" font-style="normal">1/2</tspan></text>
  <text x="432" y="526" text-anchor="middle" class="math math-label">t<tspan baseline-shift="sub" font-size="70%" font-style="normal">i</tspan></text>
  <text x="552" y="526" text-anchor="middle" class="math math-label">t<tspan baseline-shift="sub" font-size="70%" font-style="normal">i+1</tspan></text>
  <text x="492" y="566" text-anchor="middle" class="math math-label">t<tspan baseline-shift="sub" font-size="70%" font-style="normal">1/2</tspan></text>
  <path d="M362 327 C386 323 407 312 421 304" class="leader"/><text x="352" y="333" text-anchor="end" class="ui note">point juste avant</text>
  <path d="M675 176 C630 177 592 187 564 197" class="leader"/><text x="685" y="182" class="ui note">point juste après</text>
  <text x="938" y="526" text-anchor="middle" class="math math-label">t</text>
</svg>
